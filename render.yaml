services:
  - type: web
    name: nettrack-dfa-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false
      - key: ENABLE_LIVE_NETWORK_CHECKS
        value: "true"
      - key: NETWORK_CHECK_TIMEOUT_MS
        value: "2000"
